<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System (KDS) - Pro Edition</title>
  <!-- Central Config & Supabase Client -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ================= SHOP SELECTOR OVERLAY ================= */
    #kds-auth-overlay {
      position: fixed; inset: 0; background: #0b1120; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .auth-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px;
      max-width: 600px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    .shop-select-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px; margin: 20px 0; max-height: 50vh; overflow-y: auto;
    }
    .shop-btn-card {
      background: #0f172a; border: 2px solid #334155; border-radius: 12px; padding: 14px 10px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      transition: all 0.15s ease; color: #fff;
    }
    .shop-btn-card:hover { border-color: #f59e0b; transform: translateY(-2px); }
    .shop-btn-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; }
    .shop-btn-card h4 { font-size: 13px; line-height: 1.2; }
    .pin-box { display: none; margin-top: 15px; }
    .pin-input {
      padding: 10px 14px; font-size: 18px; text-align: center; letter-spacing: 4px;
      border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; width: 160px;
    }

    /* ================= TOP HEADER ================= */
    .kds-header {
      background: #1e293b; padding: 10px 20px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 2px solid #334155; flex-wrap: wrap; gap: 10px;
    }
    .kds-title-area { display: flex; align-items: center; gap: 10px; }
    .shop-name-tag { font-size: 18px; font-weight: 800; color: #facc15; }
    .live-badge { background: #16a34a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: bold; }

    /* Nav View Tabs */
    .view-tabs { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: #94a3b8; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .tab-btn.active { background: #334155; color: #fff; }

    .header-controls { display: flex; gap: 8px; align-items: center; }
    .sound-select {
      background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 6px 10px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .btn-top {
      background: #334155; color: #fff; border: 1px solid #475569; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
    }
    .btn-switch { background: #ef4444; border-color: #dc2626; }

    /* ================= LIVE ORDERS GRID ================= */
    .orders-grid {
      flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px; overflow-y: auto; align-content: start;
    }

    .order-card {
      background: #1e293b; border: 2px solid #f59e0b; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .card-top {
      background: #78350f; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .card-token { font-size: 24px; font-weight: 900; color: #fff; }
    .timer-badge { font-family: monospace; font-size: 12px; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: #0f172a; color: #facc15; }
    .timer-late { background: #dc2626 !important; color: #fff; }

    .card-meta {
      padding: 6px 14px; font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between;
      border-bottom: 1px dashed #334155; background: #1a2234;
    }
    .meta-phone { color: #38bdf8; font-weight: bold; }

    .card-items { flex: 1; padding: 10px 14px; max-height: 250px; overflow-y: auto; }
    .kds-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #283548; font-size: 15px;
    }
    .kds-item-name { font-weight: 700; color: #ffffff; }
    .spicy-tag { color: #ef4444; font-weight: bold; font-size: 12px; margin-left: 4px; }
    .kds-item-qty {
      background: #facc15; color: #000; font-weight: 900; font-size: 17px;
      padding: 2px 9px; border-radius: 6px;
    }

    .card-actions { padding: 10px 14px; background: #1a2234; border-top: 1px solid #334155; }
    .btn-done-single {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none;
      border-radius: 8px; cursor: pointer; background: #16a34a; color: #fff; transition: 0.1s;
    }
    .btn-done-single:active { transform: scale(0.97); background: #15803d; }

    /* ================= HISTORY VIEW ================= */
    #history-view {
      display: none; flex: 1; flex-direction: column; padding: 16px; overflow-y: auto;
    }
    .history-toolbar {
      display: flex; gap: 10px; margin-bottom: 14px; align-items: center;
    }
    .search-box {
      flex: 1; max-width: 400px; padding: 10px 14px; background: #1e293b; border: 1px solid #475569;
      border-radius: 8px; color: #fff; font-size: 14px;
    }
    .history-table {
      width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden;
      font-size: 13px;
    }
    .history-table th, .history-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #334155; }
    .history-table th { background: #334155; color: #facc15; font-weight: bold; }
    .btn-recall {
      background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 4px;
      cursor: pointer; font-weight: bold; font-size: 12px;
    }

    .empty-state {
      grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 60vh; color: #64748b; font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- ================= AUTH OVERLAY ================= -->
  <div id="kds-auth-overlay">
    <div class="auth-card">
      <h2 style="color:#f8fafc; margin-bottom:4px;">🧑‍🍳 KDS കിച്ചൻ ബ്രാഞ്ച് തിരഞ്ഞെടുക്കുക</h2>
      <p style="color:#94a3b8; font-size:13px;">കിച്ചൻ ഡിസ്‌പ്ലേക്കായി നിങ്ങളുടെ ഷോപ്പ് PIN നൽകുക</p>
      
      <div class="shop-select-grid" id="kds-shops-list"></div>

      <div class="pin-box" id="kds-pin-box">
        <h4 id="kds-pin-title" style="color:#f59e0b; margin-bottom:10px;"></h4>
        <input type="password" id="kds-pin-input" class="pin-input" maxlength="6" placeholder="PIN" onkeyup="checkPinEntry(event)">
        <div style="margin-top:12px; display:flex; gap:10px; justify-content:center;">
          <button onclick="cancelPinPrompt()" class="btn-top">Cancel</button>
          <button onclick="verifyAndLoginKDS()" class="btn-top" style="background:#16a34a; border-color:#16a34a;">Login (തുറക്കുക)</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= TOP HEADER ================= -->
  <div class="kds-header">
    <div class="kds-title-area">
      <span class="shop-name-tag" id="header-shop-name">KDS</span>
      <span class="live-badge" id="live-indicator">🟢 LIVE</span>
    </div>

    <!-- Live vs History Toggle -->
    <div class="view-tabs">
      <button class="tab-btn active" id="tab-live" onclick="switchView('live')">
        🔥 ലൈവ് ഓർഡറുകൾ (<span id="live-count">0</span>)
      </button>
      <button class="tab-btn" id="tab-history" onclick="switchView('history')">
        📜 കഴിഞ്ഞവ (History)
      </button>
    </div>

    <div class="header-controls">
      <!-- Sound Selector -->
      <select id="sound-type-select" class="sound-select" onchange="saveSoundPreference()">
        <option value="chime">🔔 Classic Chime</option>
        <option value="buzzer">📢 Loud Buzzer</option>
        <option value="double_beep">⏱️ Double Beep</option>
        <option value="mute">🔇 Mute (ശബ്ദം വേണ്ട)</option>
      </select>
      <button class="btn-top" onclick="triggerAlertSound()">🔊 ടെസ്റ്റ്</button>
      <button class="btn-top btn-switch" onclick="switchKdsShop()">🔄 Switch Branch</button>
    </div>
  </div>

  <!-- ================= VIEW 1: LIVE ORDERS GRID ================= -->
  <div class="orders-grid" id="kds-orders-container">
    <div class="empty-state">
      <div style="font-size: 50px; margin-bottom: 10px;">🧑‍🍳</div>
      <div>ഓർഡറുകൾ ഒന്നും വന്നിട്ടില്ല (Waiting for orders...)</div>
    </div>
  </div>

  <!-- ================= VIEW 2: ORDER HISTORY & SEARCH ================= -->
  <div id="history-view">
    <div class="history-toolbar">
      <input type="text" id="history-search-input" class="search-box" 
        placeholder="🔍 ടോക്കൺ നമ്പർ (#05) അല്ലെങ്കിൽ മൊബൈൽ നമ്പർ തിരയുക..." oninput="filterHistoryList()">
      <span style="color:#94a3b8; font-size:13px;" id="history-count-text"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="history-table">
        <thead>
          <tr>
            <th>Token</th>
            <th>Type</th>
            <th>Customer Phone</th>
            <th>Items</th>
            <th>Time Ordered</th>
            <th>Time Completed</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    let currentShop = null;
    let selectedPendingShop = null;
    let supabaseClient = null;
    let liveOrders = [];
    let historyOrders = [];
    let currentView = 'live';

    const localChannel = new BroadcastChannel('broast_pos_channel');

    // --- Audio Alert Synthesizer (Chime, Buzzer, Double Beep) ---
    function triggerAlertSound() {
      const mode = document.getElementById('sound-type-select').value;
      if (mode === 'mute') return;

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        if (mode === 'chime') {
          // Classic 2-tone chime
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc1.connect(gain1); gain1.connect(audioCtx.destination);
          osc1.start(); osc1.stop(audioCtx.currentTime + 0.25);

          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.35);
          }, 150);

        } else if (mode === 'buzzer') {
          // Loud Kitchen Buzzer (Sawtooth wave)
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.5);

        } else if (mode === 'double_beep') {
          // Double Digital Beep
          const playBeep = (delay) => {
            setTimeout(() => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square';
              osc.frequency.setValueAtTime(900, audioCtx.currentTime);
              gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }, delay);
          };
          playBeep(0);
          playBeep(140);
        }
      } catch (err) {
        console.warn("Audio Context Error:", err);
      }
    }

    function saveSoundPreference() {
      const mode = document.getElementById('sound-type-select').value;
      localStorage.setItem('kds_sound_mode', mode);
    }

    // --- Authentication & Shop Switching ---
    function initKdsAuth() {
      const savedSound = localStorage.getItem('kds_sound_mode') || 'chime';
      document.getElementById('sound-type-select').value = savedSound;

      const savedShopId = localStorage.getItem('kds_active_shop_id');
      const shops = window.SHOPS_CONFIG || [];[cite: 3]

      if (savedShopId && shops.length > 0) {
        const found = shops.find(s => s.id === savedShopId);[cite: 3]
        if (found) {
          activateKdsShop(found);
          return;
        }
      }
      renderKdsShopOverlay();
    }

    function renderKdsShopOverlay() {
      const overlay = document.getElementById('kds-auth-overlay');
      const grid = document.getElementById('kds-shops-list');
      const pinBox = document.getElementById('kds-pin-box');
      overlay.style.display = 'flex';
      pinBox.style.display = 'none';
      grid.innerHTML = '';

      const shops = window.SHOPS_CONFIG || [];[cite: 3]
      shops.forEach(s => {
        const card = document.createElement('div');
        card.className = 'shop-btn-card';
        card.innerHTML = `
          <img src="${s.logo || 'shop1.png'}" onerror="this.src='https://placehold.co/50x50/334155/white?text=SHOP'" alt="">
          <h4>${s.name}</h4>
          <small style="color:#64748b; font-size:11px;">${s.tagline || ''}</small>
        `;
        card.onclick = () => promptKdsPin(s);
        grid.appendChild(card);
      });
    }

    function promptKdsPin(s) {
      selectedPendingShop = s;
      document.getElementById('kds-pin-title').innerText = `${s.name} PIN നൽകുക:`;[cite: 3]
      document.getElementById('kds-pin-box').style.display = 'block';
      const input = document.getElementById('kds-pin-input');
      input.value = '';
      input.focus();
    }

    function cancelPinPrompt() {
      selectedPendingShop = null;
      document.getElementById('kds-pin-box').style.display = 'none';
    }

    function checkPinEntry(e) {
      if (e.key === 'Enter') verifyAndLoginKDS();
    }

    function verifyAndLoginKDS() {
      const pin = document.getElementById('kds-pin-input').value.trim();
      const masterPin = window.MASTER_PIN || "0000";[cite: 3]

      if (selectedPendingShop && (pin === selectedPendingShop.pin || pin === masterPin)) {[cite: 3]
        activateKdsShop(selectedPendingShop);
      } else {
        alert("തെറ്റായ PIN നമ്പർ! വീണ്ടും ശ്രമിക്കുക.");
        document.getElementById('kds-pin-input').value = '';
        document.getElementById('kds-pin-input').focus();
      }
    }

    function activateKdsShop(s) {
      currentShop = s;
      localStorage.setItem('kds_active_shop_id', s.id);
      document.getElementById('kds-auth-overlay').style.display = 'none';
      document.getElementById('header-shop-name').innerText = `🍗 ${s.name} (KDS)`;[cite: 3]

      // Load cache
      liveOrders = JSON.parse(localStorage.getItem(`kds_live_${s.id}`)) || [];
      historyOrders = JSON.parse(localStorage.getItem(`kds_history_${s.id}`)) || [];
      renderLiveGrid();

      // Connect to Supabase
      if (s.url && s.key && window.supabase) {[cite: 3]
        supabaseClient = window.supabase.createClient(s.url, s.key);[cite: 3]
        fetchSupabaseOrders();
        listenSupabaseRealtime();
      }
    }

    function switchKdsShop() {
      if (confirm("മറ്റൊരു കിച്ചൻ ബ്രാഞ്ചിലേക്ക് മാറാൻ ലോഗൗട്ട് ചെയ്യണോ?")) {
        localStorage.removeItem('kds_active_shop_id');
        currentShop = null;
        supabaseClient = null;
        renderKdsShopOverlay();
      }
    }

    // --- Supabase Sync & Realtime ---
    async function fetchSupabaseOrders() {
      if (!supabaseClient) return;
      try {
        // Fetch Live pending orders
        const { data: pendingData } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('status', 'pending')
          .order('id', { ascending: true });

        if (pendingData) {
          liveOrders = pendingData;
          saveLocalKdsState();
          renderLiveGrid();
        }

        // Fetch Recent Completed Orders for History
        const { data: doneData } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('status', 'completed')
          .order('id', { ascending: false })
          .limit(60);

        if (doneData) {
          historyOrders = doneData;
          saveLocalKdsState();
        }
      } catch (err) {
        console.error("Supabase fetch error:", err);
      }
    }

    function listenSupabaseRealtime() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('kds-live-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
          const newOrder = payload.new;
          if (newOrder.status === 'pending' && !liveOrders.find(o => o.id === newOrder.id)) {
            liveOrders.push(newOrder);
            saveLocalKdsState();
            triggerAlertSound();
            renderLiveGrid();
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, payload => {
          const updated = payload.new;
          if (updated.status === 'completed') {
            liveOrders = liveOrders.filter(o => o.id !== updated.id);
            if (!historyOrders.find(o => o.id === updated.id)) {
              historyOrders.unshift(updated);
            }
          } else if (updated.status === 'pending') {
            historyOrders = historyOrders.filter(o => o.id !== updated.id);
            if (!liveOrders.find(o => o.id === updated.id)) {
              liveOrders.push(updated);
            }
          }
          saveLocalKdsState();
          renderLiveGrid();
          if (currentView === 'history') renderHistoryTable();
        })
        .subscribe();
    }

    // --- Local Fallback Broadcast ---
    localChannel.onmessage = function(e) {
      if (e.data && e.data.type === 'NEW_ORDER') {
        const newOrder = e.data.order;
        if (!currentShop || newOrder.shop_id === currentShop.id) {
          if (!liveOrders.find(o => o.id === newOrder.id)) {
            liveOrders.push(newOrder);
            saveLocalKdsState();
            triggerAlertSound();
            renderLiveGrid();
          }
        }
      }
    };

    function saveLocalKdsState() {
      if (currentShop) {
        localStorage.setItem(`kds_live_${currentShop.id}`, JSON.stringify(liveOrders));
        localStorage.setItem(`kds_history_${currentShop.id}`, JSON.stringify(historyOrders));
      }
    }

    // --- 1-Click Order Complete ---
    async function completeOrderSingleClick(orderId) {
      const order = liveOrders.find(o => o.id === orderId);
      if (!order) return;

      // Move locally
      order.status = 'completed';
      order.completed_at = new Date().toLocaleTimeString();
      liveOrders = liveOrders.filter(o => o.id !== orderId);
      historyOrders.unshift(order);
      saveLocalKdsState();
      renderLiveGrid();

      // Cloud Update
      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({
              status: 'completed',
              completed_at: new Date().toISOString()
            })
            .eq('id', orderId);
        } catch (err) {
          console.error("Supabase complete error:", err);
        }
      }
    }

    // --- Recall Order from History back to Live ---
    async function recallOrderBackToLive(orderId) {
      const order = historyOrders.find(o => o.id === orderId);
      if (!order) return;

      order.status = 'pending';
      historyOrders = historyOrders.filter(o => o.id !== orderId);
      liveOrders.push(order);
      saveLocalKdsState();
      renderHistoryTable();
      renderLiveGrid();

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({
              status: 'pending',
              completed_at: null
            })
            .eq('id', orderId);
        } catch (err) {
          console.error("Supabase recall error:", err);
        }
      }
      alert(`${order.token} വീണ്ടും ലൈവ് കിച്ചനിലേക്ക് തിരികെ മാറ്റി!`);
    }

    // --- UI View Switching (Live vs History) ---
    function switchView(view) {
      currentView = view;
      document.getElementById('tab-live').classList.toggle('active', view === 'live');
      document.getElementById('tab-history').classList.toggle('active', view === 'history');

      if (view === 'live') {
        document.getElementById('kds-orders-container').style.display = 'grid';
        document.getElementById('history-view').style.display = 'none';
        renderLiveGrid();
      } else {
        document.getElementById('kds-orders-container').style.display = 'none';
        document.getElementById('history-view').style.display = 'flex';
        renderHistoryTable();
      }
    }

    // --- Render Live Orders Grid ---
    function renderLiveGrid() {
      const container = document.getElementById('kds-orders-container');
      document.getElementById('live-count').innerText = liveOrders.length;

      if (liveOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 50px; margin-bottom: 10px;">🧑‍🍳</div>
            <div>പെൻഡിങ് ഓർഡറുകൾ ഒന്നുമില്ല (All Orders Completed!)</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      const now = Date.now();

      liveOrders.forEach(order => {
        const elapsedSec = Math.floor((now - order.id) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');
        const isLate = elapsedSec > 600; // 10 minutes warning

        const custPhone = order.customer_phone || order.phone || '';

        let itemsHtml = (order.items || []).map(it => {
          const isSpicy = it.name.includes('Spicy');
          return `
            <div class="kds-item-row">
              <div class="kds-item-name">
                ${it.name}
                ${isSpicy ? `<span class="spicy-tag">🌶️ SPICY</span>` : ''}
              </div>
              <div class="kds-item-qty">X ${it.qty}</div>
            </div>
          `;
        }).join('');

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-token">${order.token}</span>
            <span class="timer-badge ${isLate ? 'timer-late' : ''}" id="timer-${order.id}">⏱️ ${mins}:${secs}</span>
          </div>
          <div class="card-meta">
            <span>${order.order_type || order.type || 'Takeaway'}</span>
            ${custPhone ? `<span class="meta-phone">📞 ${custPhone}</span>` : `<span>${order.time || ''}</span>`}
          </div>
          <div class="card-items">
            ${itemsHtml}
          </div>
          <div class="card-actions">
            <button class="btn-done-single" onclick="completeOrderSingleClick(${order.id})">
              ✅ കംപ്ലീറ്റ് (Done)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- Render History Table ---
    function renderHistoryTable() {
      const tbody = document.getElementById('history-table-body');
      const searchVal = document.getElementById('history-search-input').value.toLowerCase().trim();

      let list = historyOrders;
      if (searchVal) {
        list = list.filter(o => {
          const tokenMatch = (o.token || '').toLowerCase().includes(searchVal);
          const phoneMatch = (o.customer_phone || o.phone || '').includes(searchVal);
          return tokenMatch || phoneMatch;
        });
      }

      document.getElementById('history-count-text').innerText = `${list.length} കഴിഞ്ഞ ഓർഡറുകൾ`;
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding:20px;">ഓർഡറുകൾ ഒന്നും കണ്ടെത്തിയില്ല</td></tr>`;
        return;
      }

      list.forEach(o => {
        const itemsSummary = (o.items || []).map(it => `${it.name} (x${it.qty})`).join(', ');
        const custPhone = o.customer_phone || o.phone || '-';

        tbody.innerHTML += `
          <tr>
            <td><strong style="color:#facc15; font-size:15px;">${o.token}</strong></td>
            <td>${o.order_type || o.type || '-'}</td>
            <td style="color:#38bdf8;">${custPhone}</td>
            <td style="max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${itemsSummary}</td>
            <td>${o.time || '-'}</td>
            <td style="color:#10b981;">${o.completed_at || 'Done'}</td>
            <td>
              <button class="btn-recall" onclick="recallOrderBackToLive(${o.id})">↩️ Recall</button>
            </td>
          </tr>
        `;
      });
    }

    function filterHistoryList() {
      renderHistoryTable();
    }

    // Live Timers update every second
    setInterval(() => {
      if (currentView !== 'live') return;
      const now = Date.now();
      liveOrders.forEach(order => {
        const el = document.getElementById(`timer-${order.id}`);
        if (el) {
          const elapsedSec = Math.floor((now - order.id) / 1000);
          const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
          const secs = String(elapsedSec % 60).padStart(2, '0');
          el.innerText = `⏱️ ${mins}:${secs}`;
          if (elapsedSec > 600) el.classList.add('timer-late');
        }
      });
    }, 1000);

    // Launch
    initKdsAuth();
  </script>
</body>
</html>
