<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchen Display System (KDS) - Responsive Thermal Roll</title>

  <!-- PWA & Fonts -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Central Config & Supabase -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    html, body {
      background: #0f172a; color: #f8fafc; height: 100%; width: 100%;
      overflow-x: hidden; position: relative;
    }
    body { display: flex; flex-direction: column; }

    /* RTL Layout Rules */
    body[dir="rtl"] { direction: rtl; }
    body[dir="rtl"] .history-table th, body[dir="rtl"] .history-table td { text-align: right; }

    /* ================= 4-DIGIT PIN DIRECT LOCK SCREEN ================= */
    #pin-lock-overlay {
      position: fixed; inset: 0; background: #0f172a; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px;
    }
    .pin-modal-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 20px 16px;
      max-width: 330px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .pin-dots-row { display: flex; justify-content: center; gap: 12px; margin: 12px 0 8px 0; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%; border: 2px solid #475569; background: transparent; transition: all 0.15s ease;
    }
    .pin-dot.filled { background: #f59e0b; border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
    .pin-error-text { color: #ef4444; font-size: 13px; font-weight: bold; min-height: 20px; margin-bottom: 4px; }

    .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .num-key {
      background: #0f172a; border: 1px solid #334155; color: #f8fafc; font-size: 20px; font-weight: bold;
      padding: 12px 0; border-radius: 10px; cursor: pointer; transition: 0.1s; user-select: none;
      touch-action: manipulation;
    }
    .num-key:active { transform: scale(0.94); background: #334155; }
    .num-key.backspace { font-size: 18px; color: #ef4444; }

    /* Master Branch Picker */
    #master-branch-picker {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000;
      justify-content: center; align-items: center; padding: 16px;
    }

    /* ================= TOP RESPONSIVE HEADER ================= */
    .kds-header {
      background: #1e293b; padding: 10px 12px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 2px solid #334155; flex-wrap: wrap; gap: 8px;
    }
    .kds-title-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shop-name-tag { font-size: 16px; font-weight: 800; color: #facc15; }
    .live-badge { background: #16a34a; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: bold; }

    .view-tabs { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: #94a3b8; padding: 5px 10px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
    }
    .tab-btn.active { background: #334155; color: #fff; }

    .header-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .header-select {
      background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 5px 8px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; max-width: 130px;
    }
    .btn-top {
      background: #334155; color: #fff; border: 1px solid #475569; padding: 5px 9px;
      border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
    }
    .btn-lang { background: #475569; border-color: #64748b; font-weight: 800; }
    .btn-switch { background: #ef4444; border-color: #dc2626; }

    /* ================= RESPONSIVE CARD GRID (FIFO) ================= */
    .orders-grid {
      flex: 1; padding: 10px; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px; overflow-y: auto; align-content: start;
    }

    @media (max-width: 500px) {
      .orders-grid {
        grid-template-columns: 1fr; /* Full width cards on mobile */
        padding: 8px;
        gap: 8px;
      }
    }

    .order-card {
      background: #1e293b; border: 2px solid #334155; border-radius: 10px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      cursor: pointer; transition: transform 0.1s, border-color 0.15s; user-select: none;
    }
    .order-card:active { transform: scale(0.98); }
    .order-card:hover { border-color: #38bdf8; }

    /* Urgency Colors */
    .card-priority-normal .card-top { background: #1e3a8a; }
    .card-priority-warn .card-top { background: #b45309; }
    .card-priority-urgent .card-top { background: #b91c1c; animation: pulseUrgent 1.5s infinite; }

    @keyframes pulseUrgent {
      0% { opacity: 1; }
      50% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    .card-top {
      padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
      background: #334155; color: #fff;
    }
    .card-token { font-size: 20px; font-weight: 900; color: #fff; }
    .timer-badge { font-family: monospace; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.4); color: #facc15; }

    .card-meta {
      padding: 4px 10px; font-size: 11px; color: #cbd5e1; display: flex; justify-content: space-between;
      border-bottom: 1px dashed #334155; background: #1a2234;
    }

    .card-items-compact { padding: 8px 10px; flex: 1; max-height: 120px; overflow-y: hidden; }
    .compact-item-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 3px 0; border-bottom: 1px dotted #283548; font-size: 13px;
    }
    .compact-item-name { font-weight: 700; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .compact-item-qty { background: #facc15; color: #000; font-weight: 900; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
    .compact-more-tag { font-size: 10px; color: #38bdf8; text-align: center; margin-top: 4px; font-weight: bold; }

    /* Card Action Footer with Quick Complete */
    .card-footer-action {
      background: #0f172a; padding: 6px 10px; display: flex; justify-content: space-between;
      align-items: center; border-top: 1px solid #334155; gap: 8px;
    }
    .btn-card-quick-done {
      background: #16a34a; color: #fff; border: none; padding: 6px 12px; border-radius: 6px;
      font-weight: 900; font-size: 13px; cursor: pointer; transition: 0.1s;
    }
    .btn-card-quick-done:active { transform: scale(0.92); background: #15803d; }
    .card-hint-text { font-size: 11px; color: #94a3b8; font-weight: bold; }

    /* ================= 80MM THERMAL PAPER ROLL MODAL ================= */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      justify-content: center; align-items: center; z-index: 1000; padding: 12px;
    }
    .thermal-receipt-roll {
      background: #ffffff; color: #000000; width: 330px; max-width: 100%;
      max-height: 86vh; display: flex; flex-direction: column; border-radius: 4px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
      font-family: 'Cairo', monospace; border-top: 4px dashed #64748b; border-bottom: 4px dashed #64748b;
      animation: rollSlideIn 0.2s ease-out;
    }
    @keyframes rollSlideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .thermal-header {
      padding: 12px 14px 6px 14px; text-align: center; border-bottom: 1px dashed #000;
    }
    .receipt-token-big { font-size: 38px; font-weight: 900; line-height: 1.1; margin: 2px 0; color: #000; }
    .receipt-divider { border-bottom: 1px dashed #000; margin: 6px 0; }
    .receipt-row { display: flex; justify-content: space-between; font-size: 12px; margin: 2px 0; }

    /* Scrollable Thermal Items */
    .thermal-body {
      flex: 1; overflow-y: auto; padding: 8px 14px;
    }
    .thermal-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px dotted #94a3b8;
    }
    .thermal-item-title { font-size: 15px; font-weight: 800; color: #000; }
    .thermal-item-sub { font-size: 10px; color: #475569; }
    .thermal-spicy-tag { background: #ef4444; color: #fff; font-size: 10px; font-weight: bold; padding: 1px 4px; border-radius: 3px; }
    .thermal-item-qty {
      font-size: 18px; font-weight: 900; background: #000; color: #fff;
      padding: 2px 8px; border-radius: 4px; text-align: center;
    }

    .thermal-actions {
      padding: 10px 14px; background: #f8fafc; border-top: 1px dashed #000;
      display: flex; gap: 8px;
    }
    .btn-receipt-back {
      flex: 1; padding: 11px; background: #64748b; color: #fff; border: none;
      border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-receipt-complete {
      flex: 2; padding: 11px; background: #16a34a; color: #fff; border: none;
      border-radius: 6px; font-size: 16px; font-weight: 900; cursor: pointer;
    }
    .btn-receipt-complete:active { transform: scale(0.97); background: #15803d; }

    /* ================= MULTI-DAY HISTORY VIEW ================= */
    #history-view {
      display: none; flex: 1; flex-direction: column; padding: 12px; overflow-y: auto;
    }
    .history-toolbar { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
    .date-picker-box {
      background: #1e293b; color: #facc15; border: 1px solid #475569; padding: 7px 10px;
      border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer;
    }
    .search-box {
      flex: 1; min-width: 180px; padding: 7px 10px; background: #1e293b; border: 1px solid #475569;
      border-radius: 8px; color: #fff; font-size: 12px;
    }
    .history-table-container { width: 100%; overflow-x: auto; }
    .history-table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; font-size: 12px; min-width: 580px; }
    .history-table th, .history-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
    .history-table th { background: #334155; color: #facc15; font-weight: bold; }
    .btn-recall {
      background: #0284c7; color: #fff; border: none; padding: 5px 10px; border-radius: 4px;
      cursor: pointer; font-weight: bold; font-size: 11px;
    }

    .empty-state {
      grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 50vh; color: #64748b; font-size: 16px; text-align: center;
    }
  </style>
</head>
<body>

  <!-- ================= 4-DIGIT PIN DIRECT LOCK SCREEN ================= -->
  <div id="pin-lock-overlay">
    <div class="pin-modal-card">
      <div style="font-size:32px; margin-bottom:2px;">🧑‍🍳</div>
      <h2 style="color:#f8fafc; font-size:17px;" id="ui-kds-pin-title">KDS KITCHEN PIN</h2>
      <p style="color:#94a3b8; font-size:11px; margin-top:2px;" id="ui-kds-pin-sub">Enter Shop PIN</p>
      
      <div class="pin-dots-row">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="pin-error-text" id="pin-error-msg"></div>

      <div class="numpad-grid">
        <button type="button" class="num-key" onclick="pressKey('1')">1</button>
        <button type="button" class="num-key" onclick="pressKey('2')">2</button>
        <button type="button" class="num-key" onclick="pressKey('3')">3</button>
        <button type="button" class="num-key" onclick="pressKey('4')">4</button>
        <button type="button" class="num-key" onclick="pressKey('5')">5</button>
        <button type="button" class="num-key" onclick="pressKey('6')">6</button>
        <button type="button" class="num-key" onclick="pressKey('7')">7</button>
        <button type="button" class="num-key" onclick="pressKey('8')">8</button>
        <button type="button" class="num-key" onclick="pressKey('9')">9</button>
        <button type="button" class="num-key" onclick="clearPinInput()" style="font-size:12px; color:#94a3b8;" id="ui-kds-clear">CLEAR</button>
        <button type="button" class="num-key" onclick="pressKey('0')">0</button>
        <button type="button" class="num-key backspace" onclick="pressBackspace()">⌫</button>
      </div>
    </div>
  </div>

  <!-- Master Branch Picker Modal -->
  <div id="master-branch-picker">
    <div class="pin-modal-card" style="max-width:400px;">
      <h3 style="color:#facc15; font-size:16px;">🔑 MASTER KDS ACCESS</h3>
      <p style="color:#94a3b8; font-size:11px; margin: 6px 0 12px 0;" id="ui-master-sub">Select Branch to Open:</p>
      <div id="master-branches-container" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
      <button onclick="document.getElementById('master-branch-picker').style.display='none'" class="btn-top" style="margin-top:12px; width:100%;" id="ui-master-cancel">Cancel</button>
    </div>
  </div>

  <!-- ================= TOP RESPONSIVE HEADER ================= -->
  <div class="kds-header">
    <div class="kds-title-area">
      <span class="shop-name-tag" id="header-shop-name">🍗 KDS</span>
      <span class="live-badge" id="live-indicator">LIVE</span>
      <span id="business-date-badge" style="font-size:10px; background:#0f172a; color:#facc15; padding:2px 6px; border-radius:4px; font-weight:bold;"></span>
    </div>

    <!-- Live vs History Toggle -->
    <div class="view-tabs">
      <button class="tab-btn active" id="tab-live" onclick="switchView('live')">
        🔥 <span id="ui-tab-live-text">Live</span> (<span id="live-count">0</span>)
      </button>
      <button class="tab-btn" id="tab-history" onclick="switchView('history')">
        📜 <span id="ui-tab-hist-text">History</span>
      </button>
    </div>

    <div class="header-controls">
      <!-- Language Switch -->
      <button class="btn-top btn-lang" id="btn-lang-toggle" onclick="toggleLanguage()">🌐 العربية</button>

      <!-- Dynamic Station Filter -->
      <select id="station-filter-select" class="header-select" onchange="onStationFilterChange()">
        <option value="All">Station: All (الكل)</option>
      </select>

      <!-- Sound Selector -->
      <select id="sound-type-select" class="header-select" onchange="saveSoundPreference()">
        <option value="chime">🔔 Chime</option>
        <option value="buzzer">📢 Buzzer</option>
        <option value="double_beep">⏱️ Beep</option>
        <option value="mute">🔇 Mute</option>
      </select>

      <button class="btn-top" onclick="triggerAlertSound()" id="ui-btn-test-sound">🔊</button>
      <button class="btn-top btn-switch" onclick="lockKDS()" id="ui-btn-logout">🔒</button>
    </div>
  </div>

  <!-- ================= VIEW 1: COMPACT ORDERS GRID (FIFO) ================= -->
  <div class="orders-grid" id="kds-orders-container"></div>

  <!-- ================= VIEW 2: 80MM THERMAL RECEIPT POP-UP MODAL ================= -->
  <div class="modal-backdrop" id="order-detail-modal" onclick="onModalBackdropClick(event)">
    <div class="thermal-receipt-roll" id="thermal-receipt-container">
      <div class="thermal-header">
        <div style="font-size:12px; font-weight:bold;">*** KITCHEN SLIP / تذكرة المطبخ ***</div>
        <div class="receipt-token-big" id="modal-token">#01</div>
        <div class="receipt-divider"></div>
        <div class="receipt-row">
          <span>Type / النوع:</span>
          <strong id="modal-type">Takeaway</strong>
        </div>
        <div class="receipt-row">
          <span>Time / الوقت:</span>
          <span id="modal-time">00:00</span>
        </div>
        <div class="receipt-row" id="modal-phone-row" style="display:none;">
          <span>Customer Mob:</span>
          <strong id="modal-phone" style="direction:ltr;"></strong>
        </div>
        <div class="receipt-divider"></div>
        <div class="receipt-row" style="font-weight:bold;">
          <span>ITEM / الصنف</span>
          <span>QTY / العدد</span>
        </div>
      </div>

      <!-- Scrollable Receipt Roll Items -->
      <div class="thermal-body" id="modal-items-container"></div>

      <!-- Thermal Bottom Actions -->
      <div class="thermal-actions">
        <button type="button" class="btn-receipt-back" onclick="closeOrderModal()" id="ui-btn-modal-back">
          ⬅️ Back
        </button>
        <button type="button" class="btn-receipt-complete" onclick="completeFocusedOrder()" id="ui-btn-modal-done">
          ✅ Complete (إكمال)
        </button>
      </div>
    </div>
  </div>

  <!-- ================= VIEW 3: MULTI-DAY CLOUD HISTORY ================= -->
  <div id="history-view">
    <div class="history-toolbar">
      <input type="date" id="history-calendar-picker" class="date-picker-box" onchange="fetchHistoryFromCloud()">
      <input type="text" id="history-search-input" class="search-box" 
        placeholder="🔍 Search Token (#01) or Phone..." oninput="filterHistoryList()">
      <button class="btn-top" onclick="fetchHistoryFromCloud()" style="background:#0284c7;" id="ui-btn-refresh-hist">🔄 Refresh</button>
      <span style="color:#94a3b8; font-size:12px;" id="history-count-text"></span>
    </div>
    <div class="history-table-container">
      <table class="history-table">
        <thead>
          <tr>
            <th id="ui-th-token">Token</th>
            <th id="ui-th-type">Type</th>
            <th id="ui-th-phone">Customer Phone</th>
            <th id="ui-th-items">Items</th>
            <th id="ui-th-date">Shift Date</th>
            <th id="ui-th-completed">Time Completed</th>
            <th id="ui-th-action">Action</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const FALLBACK_SHOPS = [
      { id: 'shop1', name: 'BROST', url: 'https://rgsoehlmucocfmoblxvr.supabase.co', key: 'sb_publishable_HBaYFMLtuNSD2ZcKffAbzA_-dkXWKCU', pin: '1111' }
    ];

    function getAllShops() {
      if (typeof window.SHOPS_CONFIG !== 'undefined' && Array.isArray(window.SHOPS_CONFIG) && window.SHOPS_CONFIG.length > 0) {
        return window.SHOPS_CONFIG;
      }
      return FALLBACK_SHOPS;
    }

    // --- BILINGUAL I18N DICTIONARY ---
    let currentLang = localStorage.getItem('kds_lang') || 'en';

    const kdsI18n = {
      en: {
        pinTitle: "KDS KITCHEN PIN",
        pinSub: "Enter Shop PIN",
        pinClear: "CLEAR",
        masterSub: "Select Branch to Open:",
        masterCancel: "Cancel",
        langToggle: "🌐 العربية",
        liveTab: "Live Orders",
        histTab: "History (Cloud)",
        testSound: "🔊 Test",
        logout: "🔒 Logout",
        modalBack: "⬅️ Back (رجوع)",
        modalDone: "✅ Complete Order (إكمال)",
        clickSlip: "🔍 Open Receipt Slip",
        emptyKitchen: "All orders completed! Kitchen is clear.",
        refreshCloud: "🔄 Refresh Cloud",
        searchPlaceholder: "🔍 Search Token (#01) or Phone...",
        thToken: "Token",
        thType: "Type",
        thPhone: "Customer Phone",
        thItems: "Items",
        thDate: "Shift Date",
        thCompleted: "Time Completed",
        thAction: "Action",
        recallBtn: "↩️ Recall",
        quickDone: "✅ Done"
      },
      ar: {
        pinTitle: "رمز الدخول لشاشة المطبخ",
        pinSub: "أدخل الرقم السري للفرع",
        pinClear: "مسح",
        masterSub: "اختر الفرع لفتحه:",
        masterCancel: "إلغاء",
        langToggle: "🌐 English",
        liveTab: "الطلبات الحالية",
        histTab: "سجل الطلبات (السحابة)",
        testSound: "🔊 فحص الصوت",
        logout: "🔒 خروج",
        modalBack: "⬅️ رجوع (Back)",
        modalDone: "✅ إكمال الطلب (Done)",
        clickSlip: "🔍 عرض تذكرة الطلب",
        emptyKitchen: "تم إنجاز كافة الطلبات! المطبخ جاهز.",
        refreshCloud: "🔄 تحديث السحابة",
        searchPlaceholder: "🔍 بحث برقم الطلب (#01) أو الجوال...",
        thToken: "رقم الطلب",
        thType: "نوع الطلب",
        thPhone: "جوال العميل",
        thItems: "الأصناف",
        thDate: "تاريخ الوردية",
        thCompleted: "وقت الإنجاز",
        thAction: "إجراء",
        recallBtn: "↩️ استرجاع",
        quickDone: "✅ جاهز"
      }
    };

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('kds_lang', currentLang);
      applyKdsLanguage(currentLang);
    }

    function applyKdsLanguage(lang) {
      document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
      const t = kdsI18n[lang];

      const setText = (id, val) => { const el = document.getElementById(id); if (el) el.innerText = val; };
      const setPlaceholder = (id, val) => { const el = document.getElementById(id); if (el) el.placeholder = val; };

      setText('ui-kds-pin-title', t.pinTitle);
      setText('ui-kds-pin-sub', t.pinSub);
      setText('ui-kds-clear', t.pinClear);
      setText('ui-master-sub', t.masterSub);
      setText('ui-master-cancel', t.masterCancel);
      setText('btn-lang-toggle', t.langToggle);
      setText('ui-tab-live-text', t.liveTab);
      setText('ui-tab-hist-text', t.histTab);
      setText('ui-btn-modal-back', t.modalBack);
      setText('ui-btn-modal-done', t.modalDone);
      setText('ui-btn-refresh-hist', t.refreshCloud);
      setPlaceholder('history-search-input', t.searchPlaceholder);

      setText('ui-th-token', t.thToken);
      setText('ui-th-type', t.thType);
      setText('ui-th-phone', t.thPhone);
      setText('ui-th-items', t.thItems);
      setText('ui-th-date', t.thDate);
      setText('ui-th-completed', t.thCompleted);
      setText('ui-th-action', t.thAction);

      renderLiveGrid();
      if (currentView === 'history') renderHistoryTable();
    }

    let enteredPin = "";
    let currentShop = null;
    let supabaseClient = null;
    let liveOrders = [];
    let historyOrders = [];
    let currentView = 'live';
    let currentStation = localStorage.getItem('kds_selected_station') || 'All';
    let currentlyFocusedOrderId = null;

    let localChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        localChannel = new BroadcastChannel('broast_pos_channel');
      }
    } catch(e) {}

    function getSaudiBusinessDate() {
      const now = new Date();
      const saudiTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3 * 3600000));
      if (saudiTime.getHours() < 6) {
        saudiTime.setDate(saudiTime.getDate() - 1);
      }
      return saudiTime.toISOString().slice(0, 10);
    }

    // --- PIN AUTHENTICATION ---
    function pressKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += String(num);
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(verify4DigitPin, 100);
        }
      }
    }

    function pressBackspace() {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDots();
      }
    }

    function clearPinInput() {
      enteredPin = "";
      updatePinDots();
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) dot.classList.toggle('filled', i < enteredPin.length);
      }
    }

    function verify4DigitPin() {
      const masterPin = typeof window.MASTER_PIN !== 'undefined' ? String(window.MASTER_PIN).trim() : "0000";
      const shops = getAllShops();

      if (enteredPin === masterPin) {
        openMasterBranchPicker();
        return;
      }

      let matchedShop = shops.find(s => String(s.pin).trim() === enteredPin);
      if (!matchedShop && (enteredPin === "1111" || enteredPin === "1234")) {
        matchedShop = shops[0];
      }

      if (matchedShop) {
        activateKdsShop(matchedShop);
      } else {
        const err = document.getElementById('pin-error-msg');
        if (err) err.innerText = currentLang === 'ar' ? "❌ رمز غير صحيح! (1111 أو 1234)" : "❌ Invalid PIN! (1111 or 1234)";
        setTimeout(clearPinInput, 800);
      }
    }

    function openMasterBranchPicker() {
      const picker = document.getElementById('master-branch-picker');
      const container = document.getElementById('master-branches-container');
      container.innerHTML = '';
      picker.style.display = 'flex';

      getAllShops().forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-top';
        btn.style.cssText = 'padding:12px; font-size:12px; background:#0f172a; border:1px solid #475569;';
        btn.innerText = `${s.name} (${s.pin})`;
        btn.onclick = () => {
          picker.style.display = 'none';
          activateKdsShop(s);
        };
        container.appendChild(btn);
      });
    }

    // --- DYNAMIC STATIONS LOADER ---
    async function loadDynamicStationsInKDS() {
      const select = document.getElementById('station-filter-select');
      if (!select || !currentShop) return;

      let stations = [];
      try {
        stations = JSON.parse(localStorage.getItem(`pos_stations_${currentShop.id}`)) || [];
      } catch(e) {}

      if (!stations || stations.length === 0) {
        stations = [
          { name: "Main Kitchen" },
          { name: "Broast Station" },
          { name: "Drinks Counter" }
        ];
      }

      if (supabaseClient) {
        try {
          const { data } = await supabaseClient.from('kitchen_stations').select('*').eq('shop_id', currentShop.id);
          if (data && data.length > 0) stations = data;
        } catch(e) {}
      }

      select.innerHTML = `<option value="All">Station: All (الكل)</option>`;
      stations.forEach(st => {
        select.innerHTML += `<option value="${st.name}">Station: ${st.name}</option>`;
      });

      if (stations.some(s => s.name === currentStation)) {
        select.value = currentStation;
      } else {
        currentStation = 'All';
        select.value = 'All';
        localStorage.setItem('kds_selected_station', 'All');
      }
    }

    async function activateKdsShop(s) {
      currentShop = s;
      localStorage.setItem('kds_active_shop_id', s.id);
      document.getElementById('pin-lock-overlay').style.display = 'none';
      clearPinInput();

      document.getElementById('header-shop-name').innerText = `🍗 ${s.name} (KDS)`;
      const bDate = getSaudiBusinessDate();
      document.getElementById('business-date-badge').innerText = `📅 Shift: ${bDate}`;

      const historyCal = document.getElementById('history-calendar-picker');
      if (historyCal) historyCal.value = bDate;

      const savedSound = localStorage.getItem('kds_sound_mode') || 'chime';
      document.getElementById('sound-type-select').value = savedSound;

      try {
        liveOrders = JSON.parse(localStorage.getItem(`kds_live_${s.id}`)) || [];
        if (!Array.isArray(liveOrders)) liveOrders = [];
      } catch(e) { liveOrders = []; }

      try {
        historyOrders = JSON.parse(localStorage.getItem(`kds_history_${s.id}`)) || [];
        if (!Array.isArray(historyOrders)) historyOrders = [];
      } catch(e) { historyOrders = []; }

      applyKdsLanguage(currentLang);

      if (s.url && s.key && window.supabase) {
        supabaseClient = window.supabase.createClient(s.url, s.key);
        await loadDynamicStationsInKDS();
        await fetchLiveOrdersFromCloud();
        await fetchHistoryFromCloud();
        listenSupabaseRealtime();
      } else {
        await loadDynamicStationsInKDS();
      }
    }

    function lockKDS() {
      currentShop = null;
      supabaseClient = null;
      localStorage.removeItem('kds_active_shop_id');
      clearPinInput();
      document.getElementById('pin-lock-overlay').style.display = 'flex';
    }

    // --- Audio Alert ---
    function triggerAlertSound() {
      const mode = document.getElementById('sound-type-select').value;
      if (mode === 'mute') return;

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (mode === 'chime') {
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc1.connect(gain1); gain1.connect(audioCtx.destination);
          osc1.start(); osc1.stop(audioCtx.currentTime + 0.25);

          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.35);
          }, 150);
        } else if (mode === 'buzzer') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (mode === 'double_beep') {
          const playBeep = (delay) => {
            setTimeout(() => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
              gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }, delay);
          };
          playBeep(0); playBeep(140);
        }
      } catch (e) {}
    }

    function saveSoundPreference() {
      const mode = document.getElementById('sound-type-select').value;
      localStorage.setItem('kds_sound_mode', mode);
    }

    function onStationFilterChange() {
      currentStation = document.getElementById('station-filter-select').value;
      localStorage.setItem('kds_selected_station', currentStation);
      renderLiveGrid();
    }

    // --- FIFO FETCH FROM CLOUD ---
    async function fetchLiveOrdersFromCloud() {
      if (!supabaseClient || !currentShop) return;
      try {
        const { data } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('shop_id', currentShop.id)
          .eq('status', 'pending')
          .order('id', { ascending: true }); // Strict FIFO order

        if (data) {
          liveOrders = data;
          saveLocalKdsState();
          renderLiveGrid();
        }
      } catch (e) {}
    }

    // Multi-Day History Fetch
    async function fetchHistoryFromCloud() {
      if (!supabaseClient || !currentShop) return;
      const cal = document.getElementById('history-calendar-picker');
      const targetDate = cal ? cal.value : getSaudiBusinessDate();

      try {
        const { data } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('shop_id', currentShop.id)
          .eq('business_date', targetDate)
          .eq('status', 'completed')
          .order('id', { ascending: false });

        if (data) {
          historyOrders = data;
          saveLocalKdsState();
          if (currentView === 'history') renderHistoryTable();
        }
      } catch (e) {}
    }

    function listenSupabaseRealtime() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('kds-live-orders-realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
          const newOrder = payload.new;
          if (newOrder.shop_id === currentShop.id && newOrder.status === 'pending') {
            if (!liveOrders.find(o => String(o.id) === String(newOrder.id))) {
              liveOrders.push(newOrder);
              liveOrders.sort((a,b) => Number(a.id) - Number(b.id)); // Maintain FIFO
              saveLocalKdsState();
              triggerAlertSound();
              renderLiveGrid();
            }
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, payload => {
          const updated = payload.new;
          if (updated.shop_id !== currentShop.id) return;

          if (updated.status === 'completed') {
            liveOrders = liveOrders.filter(o => String(o.id) !== String(updated.id));
            if (!historyOrders.find(o => String(o.id) === String(updated.id))) {
              historyOrders.unshift(updated);
            }
            if (currentlyFocusedOrderId && String(currentlyFocusedOrderId) === String(updated.id)) {
              closeOrderModal();
            }
          } else if (updated.status === 'pending') {
            historyOrders = historyOrders.filter(o => String(o.id) !== String(updated.id));
            if (!liveOrders.find(o => String(o.id) === String(updated.id))) {
              liveOrders.push(updated);
              liveOrders.sort((a,b) => Number(a.id) - Number(b.id));
            }
          }
          saveLocalKdsState();
          renderLiveGrid();
          if (currentView === 'history') renderHistoryTable();
        })
        .subscribe();
    }

    if (localChannel) {
      localChannel.onmessage = function(e) {
        if (e.data && e.data.type === 'NEW_ORDER') {
          const newOrder = e.data.order;
          if (!currentShop || newOrder.shop_id === currentShop.id) {
            if (!liveOrders.find(o => String(o.id) === String(newOrder.id))) {
              liveOrders.push(newOrder);
              liveOrders.sort((a,b) => Number(a.id) - Number(b.id));
              saveLocalKdsState();
              triggerAlertSound();
              renderLiveGrid();
            }
          }
        }
      };
    }

    function saveLocalKdsState() {
      if (currentShop) {
        localStorage.setItem(`kds_live_${currentShop.id}`, JSON.stringify(liveOrders));
        localStorage.setItem(`kds_history_${currentShop.id}`, JSON.stringify(historyOrders));
      }
    }

    // --- RENDER COMPACT CARDS WITH QUICK COMPLETE BUTTON ---
    function renderLiveGrid() {
      const container = document.getElementById('kds-orders-container');
      if (!container) return;
      const now = Date.now();
      const t = kdsI18n[currentLang];

      liveOrders.sort((a, b) => Number(a.id) - Number(b.id)); // FIFO

      let displayOrders = liveOrders.map(order => {
        let rawItems = order.items || [];
        if (typeof rawItems === 'string') {
          try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
        }
        if (!Array.isArray(rawItems)) rawItems = [];

        let items = rawItems;
        if (currentStation !== 'All') {
          items = items.filter(it => (it.station || 'Main Kitchen') === currentStation);
        }
        return { ...order, filteredItems: items };
      }).filter(order => order.filteredItems && order.filteredItems.length > 0);

      const countEl = document.getElementById('live-count');
      if (countEl) countEl.innerText = displayOrders.length;

      if (displayOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 8px;">🧑‍🍳</div>
            <div>${t.emptyKitchen}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      displayOrders.forEach(order => {
        const orderTimeMs = Number(order.id) || now;
        const elapsedSec = Math.floor((now - orderTimeMs) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');

        let priorityClass = 'card-priority-normal';
        if (elapsedSec > 600) priorityClass = 'card-priority-urgent';
        else if (elapsedSec > 300) priorityClass = 'card-priority-warn';

        const custPhone = order.customer_phone || order.phone || '';

        // First 3 items for compact view
        const visibleItems = order.filteredItems.slice(0, 3);
        const remainingCount = order.filteredItems.length - 3;

        let itemsCompactHtml = visibleItems.map(it => `
          <div class="compact-item-line">
            <span class="compact-item-name">${it.name || ''}</span>
            <span class="compact-item-qty">X ${it.qty || 1}</span>
          </div>
        `).join('');

        if (remainingCount > 0) {
          itemsCompactHtml += `<div class="compact-more-tag">+ ${remainingCount} more items...</div>`;
        }

        const card = document.createElement('div');
        card.className = `order-card ${priorityClass}`;
        // Clicking card opens 80mm thermal roll popup
        card.onclick = () => openThermalReceiptModal(order.id);

        card.innerHTML = `
          <div class="card-top">
            <span class="card-token">${order.token || 'Token'}</span>
            <span class="timer-badge" id="timer-${order.id}">⏱️ ${mins}:${secs}</span>
          </div>
          <div class="card-meta">
            <span>${order.order_type || 'Takeaway'}</span>
            ${custPhone ? `<span style="color:#38bdf8;">📞 ${custPhone}</span>` : `<span>${order.time || ''}</span>`}
          </div>
          <div class="card-items-compact">
            ${itemsCompactHtml}
          </div>
          <div class="card-footer-action">
            <span class="card-hint-text">${t.clickSlip}</span>
            <button type="button" class="btn-card-quick-done" onclick="executeQuickComplete(event, ${order.id})">
              ${t.quickDone}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- QUICK COMPLETE DIRECTLY FROM CARD ---
    function executeQuickComplete(event, orderId) {
      if (event) event.stopPropagation(); // Prevents opening the modal
      completeOrderDirect(orderId);
    }

    async function completeOrderDirect(orderId) {
      const order = liveOrders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      order.status = 'completed';
      order.completed_at = new Date().toLocaleTimeString();
      liveOrders = liveOrders.filter(o => String(o.id) !== String(orderId));
      historyOrders.unshift(order);
      saveLocalKdsState();

      if (currentlyFocusedOrderId && String(currentlyFocusedOrderId) === String(orderId)) {
        closeOrderModal();
      }

      renderLiveGrid();

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({ status: 'completed', completed_at: new Date().toISOString() })
            .eq('id', orderId);
        } catch(e) {}
      }
    }

    // --- 80MM THERMAL RECEIPT POPUP MODAL ---
    function openThermalReceiptModal(orderId) {
      const order = liveOrders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      currentlyFocusedOrderId = orderId;
      document.getElementById('modal-token').innerText = order.token || '#01';
      document.getElementById('modal-type').innerText = order.order_type || 'Takeaway';
      document.getElementById('modal-time').innerText = `${order.business_date || ''} ${order.time || ''}`;

      const phoneRow = document.getElementById('modal-phone-row');
      const phoneEl = document.getElementById('modal-phone');
      const phone = order.customer_phone || order.phone || '';
      if (phone) {
        phoneEl.innerText = phone;
        phoneRow.style.display = 'flex';
      } else {
        phoneRow.style.display = 'none';
      }

      const container = document.getElementById('modal-items-container');
      container.innerHTML = '';

      let rawItems = order.items || [];
      if (typeof rawItems === 'string') {
        try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
      }
      if (!Array.isArray(rawItems)) rawItems = [];

      let items = rawItems;
      if (currentStation !== 'All') {
        items = items.filter(it => (it.station || 'Main Kitchen') === currentStation);
      }

      items.forEach(it => {
        const isSpicy = (it.name || '').includes('Spicy') || (it.name || '').includes('حار');
        container.innerHTML += `
          <div class="thermal-item-row">
            <div>
              <div class="thermal-item-title">
                ${it.name || ''}
                ${isSpicy ? `<span class="thermal-spicy-tag">🌶️ SPICY</span>` : ''}
              </div>
              <div class="thermal-item-sub">[${it.station || 'Main Kitchen'}]</div>
            </div>
            <div class="thermal-item-qty">[ X ${it.qty || 1} ]</div>
          </div>
        `;
      });

      document.getElementById('order-detail-modal').style.display = 'flex';
    }

    function closeOrderModal() {
      currentlyFocusedOrderId = null;
      document.getElementById('order-detail-modal').style.display = 'none';
    }

    function onModalBackdropClick(event) {
      if (event.target.id === 'order-detail-modal') {
        closeOrderModal();
      }
    }

    function completeFocusedOrder() {
      if (currentlyFocusedOrderId) {
        completeOrderDirect(currentlyFocusedOrderId);
      }
    }

    // --- RECALL ORDER FROM HISTORY ---
    async function recallOrderBackToLive(orderId) {
      const order = historyOrders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      order.status = 'pending';
      historyOrders = historyOrders.filter(o => String(o.id) !== String(orderId));
      liveOrders.push(order);
      liveOrders.sort((a,b) => Number(a.id) - Number(b.id)); // Maintain FIFO
      saveLocalKdsState();
      renderHistoryTable();
      renderLiveGrid();

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({ status: 'pending', completed_at: null })
            .eq('id', orderId);
        } catch(e) {}
      }

      const msg = currentLang === 'ar' ? `تم استرجاع الطلب ${order.token} إلى شاشة المطبخ!` : `Order ${order.token} recalled back to live kitchen!`;
      alert(msg);
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-live').classList.toggle('active', view === 'live');
      document.getElementById('tab-history').classList.toggle('active', view === 'history');

      if (view === 'live') {
        document.getElementById('kds-orders-container').style.display = 'grid';
        document.getElementById('history-view').style.display = 'none';
        renderLiveGrid();
      } else {
        document.getElementById('kds-orders-container').style.display = 'none';
        document.getElementById('history-view').style.display = 'flex';
        fetchHistoryFromCloud();
        renderHistoryTable();
      }
    }

    function renderHistoryTable() {
      const tbody = document.getElementById('history-table-body');
      if (!tbody) return;
      const searchVal = (document.getElementById('history-search-input').value || '').toLowerCase().trim();
      const t = kdsI18n[currentLang];

      let list = historyOrders;
      if (searchVal) {
        list = list.filter(o => {
          const tokenMatch = (o.token || '').toLowerCase().includes(searchVal);
          const phoneMatch = (o.customer_phone || o.phone || '').includes(searchVal);
          return tokenMatch || phoneMatch;
        });
      }

      document.getElementById('history-count-text').innerText = `${list.length} Orders`;
      tbody.innerHTML = '';

      if (list.length === 0) {
        const noFound = currentLang === 'ar' ? "لا توجد طلبات في هذا التاريخ" : "No orders found for this date";
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding:16px;">${noFound}</td></tr>`;
        return;
      }

      list.forEach(o => {
        let rawItems = o.items || [];
        if (typeof rawItems === 'string') {
          try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
        }
        if (!Array.isArray(rawItems)) rawItems = [];

        const itemsSummary = rawItems.map(it => `${it.name || ''} (x${it.qty || 1})`).join(', ');
        const custPhone = o.customer_phone || o.phone || '-';

        tbody.innerHTML += `
          <tr>
            <td><strong style="color:#facc15; font-size:14px;">${o.token || '-'}</strong></td>
            <td>${o.order_type || '-'}</td>
            <td style="color:#38bdf8;">${custPhone}</td>
            <td style="max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${itemsSummary}</td>
            <td>${o.business_date || '-'}</td>
            <td style="color:#10b981;">${o.completed_at ? new Date(o.completed_at).toLocaleTimeString() : 'Done'}</td>
            <td>
              <button type="button" class="btn-recall" onclick="recallOrderBackToLive(${o.id})">${t.recallBtn}</button>
            </td>
          </tr>
        `;
      });
    }

    function filterHistoryList() {
      renderHistoryTable();
    }

    // Elapsed live timers (FIFO update loop)
    setInterval(() => {
      const now = Date.now();
      liveOrders.forEach(order => {
        const orderTimeMs = Number(order.id) || now;
        const elapsedSec = Math.floor((now - orderTimeMs) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');

        const el = document.getElementById(`timer-${order.id}`);
        if (el) el.innerText = `⏱️ ${mins}:${secs}`;
      });
    }, 1000);

    // Physical keyboard listener
    window.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('pin-lock-overlay');
      if (overlay && overlay.style.display !== 'none') {
        if (e.key >= '0' && e.key <= '9') pressKey(e.key);
        else if (e.key === 'Backspace') pressBackspace();
      }
      if (e.key === 'Escape') closeOrderModal();
    });

    // Auto-resume active session
    const activeShopId = localStorage.getItem('kds_active_shop_id');
    const existing = getAllShops().find(s => s.id === activeShopId);
    if (existing) {
      activateKdsShop(existing);
    } else {
      document.getElementById('pin-lock-overlay').style.display = 'flex';
    }
  </script>
</body>
</html>
