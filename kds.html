<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System (KDS) - Pro Station Edition</title>
  <!-- Central Config & Supabase Client -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ================= 4-DIGIT PIN DIRECT LOCK SCREEN ================= */
    #kds-pin-overlay {
      position: fixed; inset: 0; background: #0b1120; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 16px;
    }
    .pin-modal-card {
      background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 22px 20px;
      max-width: 380px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    }
    
    /* Visible PIN Box */
    .pin-display-input {
      width: 180px; padding: 10px; font-size: 26px; font-weight: bold; text-align: center;
      letter-spacing: 12px; background: #0f172a; color: #facc15; border: 2px solid #475569;
      border-radius: 12px; margin: 12px auto 6px auto; outline: none; display: block;
    }
    .pin-display-input:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

    .pin-error-text {
      color: #ef4444; font-size: 13px; font-weight: bold; min-height: 20px; margin-bottom: 6px;
    }

    /* Big Touch Numpad */
    .numpad-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px;
    }
    .num-key {
      background: #0f172a; border: 1px solid #334155; color: #f8fafc; font-size: 24px; font-weight: bold;
      padding: 14px 0; border-radius: 12px; cursor: pointer; transition: 0.1s; user-select: none;
      touch-action: manipulation;
    }
    .num-key:active { transform: scale(0.94); background: #334155; }
    .num-key.backspace { font-size: 18px; color: #ef4444; }

    /* Direct Branch Quick Selector */
    .quick-branch-area {
      margin-top: 14px; padding-top: 12px; border-top: 1px dashed #334155;
    }
    .branch-pill-btn {
      background: #0f172a; border: 1px solid #475569; color: #cbd5e1; padding: 6px 10px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; margin: 3px;
      display: inline-block; transition: 0.1s;
    }
    .branch-pill-btn:hover { border-color: #f59e0b; color: #fff; }

    /* ================= TOP HEADER ================= */
    .kds-header {
      background: #1e293b; padding: 10px 18px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 2px solid #334155; flex-wrap: wrap; gap: 10px;
    }
    .kds-title-area { display: flex; align-items: center; gap: 10px; }
    .shop-name-tag { font-size: 18px; font-weight: 800; color: #facc15; }
    .live-badge { background: #16a34a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: bold; }

    .view-tabs { display: flex; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; }
    .tab-btn {
      background: transparent; border: none; color: #94a3b8; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px;
    }
    .tab-btn.active { background: #334155; color: #fff; }

    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .header-select {
      background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 6px 10px;
      border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .btn-top {
      background: #334155; color: #fff; border: 1px solid #475569; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
    }
    .btn-switch { background: #ef4444; border-color: #dc2626; }

    /* ================= LIVE ORDERS GRID ================= */
    .orders-grid {
      flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px; overflow-y: auto; align-content: start;
    }

    .order-card {
      background: #1e293b; border: 2px solid #f59e0b; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .card-top {
      background: #78350f; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .card-token { font-size: 24px; font-weight: 900; color: #fff; }
    .timer-badge { font-family: monospace; font-size: 12px; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: #0f172a; color: #facc15; }
    .timer-late { background: #dc2626 !important; color: #fff; }

    .card-meta {
      padding: 6px 14px; font-size: 12px; color: #cbd5e1; display: flex; justify-content: space-between;
      border-bottom: 1px dashed #334155; background: #1a2234;
    }
    .meta-phone { color: #38bdf8; font-weight: bold; }

    .card-items { flex: 1; padding: 10px 14px; max-height: 250px; overflow-y: auto; }
    .kds-item-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #283548; font-size: 15px;
    }
    .kds-item-name { font-weight: 700; color: #ffffff; }
    .item-station-tag { font-size: 10px; color: #94a3b8; display: block; font-weight: normal; }
    .spicy-tag { color: #ef4444; font-weight: bold; font-size: 12px; margin-left: 4px; }
    .kds-item-qty {
      background: #facc15; color: #000; font-weight: 900; font-size: 17px;
      padding: 2px 9px; border-radius: 6px;
    }

    .card-actions { padding: 10px 14px; background: #1a2234; border-top: 1px solid #334155; }
    .btn-done-single {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border: none;
      border-radius: 8px; cursor: pointer; background: #16a34a; color: #fff; transition: 0.1s;
    }
    .btn-done-single:active { transform: scale(0.97); background: #15803d; }

    /* ================= CLOUD HISTORY VIEW ================= */
    #history-view {
      display: none; flex: 1; flex-direction: column; padding: 16px; overflow-y: auto;
    }
    .history-toolbar {
      display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; max-width: 400px; padding: 10px 14px; background: #1e293b; border: 1px solid #475569;
      border-radius: 8px; color: #fff; font-size: 14px;
    }
    .history-table {
      width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden;
      font-size: 13px;
    }
    .history-table th, .history-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #334155; }
    .history-table th { background: #334155; color: #facc15; font-weight: bold; }
    .btn-recall {
      background: #0284c7; color: #fff; border: none; padding: 6px 12px; border-radius: 4px;
      cursor: pointer; font-weight: bold; font-size: 12px;
    }

    .empty-state {
      grid-column: 1 / -1; display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 60vh; color: #64748b; font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- ================= 4-DIGIT PIN DIRECT LOCK OVERLAY ================= -->
  <div id="kds-pin-overlay">
    <div class="pin-modal-card">
      <div style="font-size:36px; margin-bottom:2px;">🧑‍🍳</div>
      <h2 style="color:#f8fafc; font-size:18px;">KDS KITCHEN PIN</h2>
      <p style="color:#94a3b8; font-size:12px; margin-top:2px;">4-അക്ക ഷോപ്പ് PIN നൽകുക</p>
      
      <!-- Visible Interactive PIN Box -->
      <input type="password" id="kds-pin-display" class="pin-display-input" maxlength="4" placeholder="••••" inputmode="numeric" oninput="handlePinInputChange(event)" onkeydown="if(event.key==='Enter') submitPinCheck()">

      <div class="pin-error-text" id="pin-error-msg"></div>

      <!-- Touch Numpad -->
      <div class="numpad-grid">
        <button type="button" class="num-key" onclick="pressNumpad('1')">1</button>
        <button type="button" class="num-key" onclick="pressNumpad('2')">2</button>
        <button type="button" class="num-key" onclick="pressNumpad('3')">3</button>
        <button type="button" class="num-key" onclick="pressNumpad('4')">4</button>
        <button type="button" class="num-key" onclick="pressNumpad('5')">5</button>
        <button type="button" class="num-key" onclick="pressNumpad('6')">6</button>
        <button type="button" class="num-key" onclick="pressNumpad('7')">7</button>
        <button type="button" class="num-key" onclick="pressNumpad('8')">8</button>
        <button type="button" class="num-key" onclick="pressNumpad('9')">9</button>
        <button type="button" class="num-key" onclick="clearPinInput()" style="font-size:13px; color:#94a3b8;">CLEAR</button>
        <button type="button" class="num-key" onclick="pressNumpad('0')">0</button>
        <button type="button" class="num-key backspace" onclick="pressBackspace()">⌫</button>
      </div>

      <button type="button" onclick="submitPinCheck()" class="btn-top" style="width:100%; background:#16a34a; border:none; padding:12px; font-size:15px; margin-top:10px;">
        തുറക്കുക (LOGIN)
      </button>

      <!-- Direct Branch Buttons (Fallback Access) -->
      <div class="quick-branch-area">
        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">നേരിട്ട് തിരഞ്ഞെടുക്കുക (Direct Branch):</div>
        <div id="quick-branches-container"></div>
      </div>
    </div>
  </div>

  <!-- ================= TOP HEADER ================= -->
  <div class="kds-header">
    <div class="kds-title-area">
      <span class="shop-name-tag" id="header-shop-name">🍗 KDS</span>
      <span class="live-badge" id="live-indicator">🟢 LIVE</span>
      <span id="business-date-badge" style="font-size:11px; background:#0f172a; color:#facc15; padding:3px 8px; border-radius:6px; font-weight:bold;"></span>
    </div>

    <!-- Live vs History Toggle -->
    <div class="view-tabs">
      <button class="tab-btn active" id="tab-live" onclick="switchView('live')">
        🔥 ലൈവ് ഓർഡറുകൾ (<span id="live-count">0</span>)
      </button>
      <button class="tab-btn" id="tab-history" onclick="switchView('history')">
        📜 കഴിഞ്ഞവ (Cloud History)
      </button>
    </div>

    <div class="header-controls">
      <!-- Station Filter -->
      <select id="station-filter-select" class="header-select" onchange="onStationFilterChange()">
        <option value="All">Station: All (എല്ലാം)</option>
        <option value="Main Kitchen">Station: Main Kitchen</option>
        <option value="Broast Station">Station: Broast Station</option>
        <option value="Burger Station">Station: Burger Station</option>
        <option value="Drinks Counter">Station: Drinks Counter</option>
      </select>

      <!-- Sound Selector -->
      <select id="sound-type-select" class="header-select" onchange="saveSoundPreference()">
        <option value="chime">🔔 Classic Chime</option>
        <option value="buzzer">📢 Loud Buzzer</option>
        <option value="double_beep">⏱️ Double Beep</option>
        <option value="mute">🔇 Mute</option>
      </select>

      <button class="btn-top" onclick="triggerAlertSound()">🔊 ടെസ്റ്റ്</button>
      <button class="btn-top btn-switch" onclick="lockKDS()">🔒 Logout</button>
    </div>
  </div>

  <!-- ================= VIEW 1: LIVE ORDERS GRID ================= -->
  <div class="orders-grid" id="kds-orders-container">
    <div class="empty-state">
      <div style="font-size: 50px; margin-bottom: 10px;">🧑‍🍳</div>
      <div>ഓർഡറുകൾ ഒന്നും വന്നിട്ടില്ല (Waiting for orders...)</div>
    </div>
  </div>

  <!-- ================= VIEW 2: CLOUD HISTORY & SEARCH ================= -->
  <div id="history-view">
    <div class="history-toolbar">
      <input type="text" id="history-search-input" class="search-box" 
        placeholder="🔍 ടോക്കൺ (#01) അല്ലെങ്കിൽ കസ്റ്റമർ ഫോൺ തിരയുക..." oninput="filterHistoryList()">
      <button class="btn-top" onclick="fetchHistoryFromCloud()" style="background:#0284c7;">🔄 Refresh Cloud History</button>
      <span style="color:#94a3b8; font-size:13px;" id="history-count-text"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="history-table">
        <thead>
          <tr>
            <th>Token</th>
            <th>Type</th>
            <th>Customer Phone</th>
            <th>Items</th>
            <th>Time Ordered</th>
            <th>Time Completed</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    function safeGet(key, def = null) {
      try { return localStorage.getItem(key) || def; } catch(e) { return def; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, val); } catch(e) {}
    }

    const FALLBACK_SHOPS = [
      { id: 'shop1', name: 'NASSER BIN EID ALMAHMADI', url: 'https://elubqoicerkldrufqcbj.supabase.co', key: 'sb_publishable_zsEKreCmounELozZ5EQ3Lg_aXyut9EK', pin: '1234' },[cite: 1]
      { id: 'shop2', name: 'BOOFIYA', url: 'https://qkjcviszzdptssvpguwc.supabase.co', key: 'sb_publishable_J0Z4b7NoP3VuDKdbC0WeIg_OQAlpnLQ', pin: '1111' },[cite: 1]
      { id: 'shop3', name: 'TAJ SPORTS', url: 'https://garpkohthpeirdhcwthk.supabase.co', key: 'sb_publishable_TNhOZnpYuthYHmSJSlyhaw_R6RS1jcY', pin: '3333' },[cite: 1]
      { id: 'shop4', name: 'MUSAD SPORTS', url: 'https://mwxbakqoipcwblhukrfs.supabase.co', key: 'sb_publishable_OfuR1PeffNa4NWUhpwV3gg_pwqovQZT', pin: '2222' }[cite: 1]
    ];

    function getAllShops() {
      if (typeof window.SHOPS_CONFIG !== 'undefined' && Array.isArray(window.SHOPS_CONFIG) && window.SHOPS_CONFIG.length > 0) {
        return window.SHOPS_CONFIG;[cite: 1]
      }
      return FALLBACK_SHOPS;
    }

    let currentShop = null;
    let supabaseClient = null;
    let liveOrders = [];
    let historyOrders = [];
    let currentView = 'live';
    let currentStation = safeGet('kds_selected_station', 'All');

    let localChannel = null;
    try {
      if (typeof BroadcastChannel !== 'undefined') {
        localChannel = new BroadcastChannel('broast_pos_channel');
      }
    } catch(e) { localChannel = null; }

    function getSaudiBusinessDate() {
      const now = new Date();
      const saudiTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (3 * 3600000));
      if (saudiTime.getHours() < 6) {
        saudiTime.setDate(saudiTime.getDate() - 1);
      }
      return saudiTime.toISOString().slice(0, 10);
    }

    function pressNumpad(num) {
      const input = document.getElementById('kds-pin-display');
      if (input && input.value.length < 4) {
        input.value += String(num);
        clearErrorText();
        if (input.value.length === 4) {
          setTimeout(submitPinCheck, 120);
        }
      }
    }

    function pressBackspace() {
      const input = document.getElementById('kds-pin-display');
      if (input && input.value.length > 0) {
        input.value = input.value.slice(0, -1);
        clearErrorText();
      }
    }

    function clearPinInput() {
      const input = document.getElementById('kds-pin-display');
      if (input) input.value = '';
      clearErrorText();
    }

    function handlePinInputChange(e) {
      clearErrorText();
      if (e.target.value.length >= 4) {
        e.target.value = e.target.value.slice(0, 4);
        setTimeout(submitPinCheck, 120);
      }
    }

    function clearErrorText() {
      const err = document.getElementById('pin-error-msg');
      if (err) err.innerText = '';
    }

    function submitPinCheck() {
      const input = document.getElementById('kds-pin-display');
      const pinStr = input ? String(input.value).trim() : '';
      if (!pinStr) return;

      const masterPin = typeof window.MASTER_PIN !== 'undefined' ? String(window.MASTER_PIN).trim() : '0000';[cite: 1]
      const shops = getAllShops();

      if (pinStr === masterPin) {
        activateKdsShop(shops[0]);
        return;
      }

      const matched = shops.find(s => String(s.pin).trim() === pinStr);
      if (matched) {
        activateKdsShop(matched);
      } else {
        const err = document.getElementById('pin-error-msg');
        if (err) err.innerText = '❌ തെറ്റായ PIN! വീണ്ടും നൽകുക.';
        clearPinInput();
      }
    }

    function renderQuickBranchButtons() {
      const container = document.getElementById('quick-branches-container');
      if (!container) return;
      container.innerHTML = '';
      getAllShops().forEach(s => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'branch-pill-btn';
        btn.innerText = `${s.name.split(' ')[0]} (${s.pin})`;[cite: 1]
        btn.onclick = () => activateKdsShop(s);
        container.appendChild(btn);
      });
    }

    async function activateKdsShop(s) {
      try {
        currentShop = s;
        safeSet('kds_active_shop_id', s.id);

        const overlay = document.getElementById('kds-pin-overlay');
        if (overlay) overlay.style.display = 'none';
        clearPinInput();

        const headName = document.getElementById('header-shop-name');
        if (headName) headName.innerText = `🍗 ${s.name} (KDS)`;

        const dateBadge = document.getElementById('business-date-badge');
        if (dateBadge) dateBadge.innerText = `📅 Shift: ${getSaudiBusinessDate()}`;

        const stationSelect = document.getElementById('station-filter-select');
        if (stationSelect) stationSelect.value = currentStation;

        const soundSelect = document.getElementById('sound-type-select');
        const savedSound = safeGet('kds_sound_mode', 'chime');
        if (soundSelect) soundSelect.value = savedSound;

        try {
          liveOrders = JSON.parse(safeGet(`kds_live_${s.id}`, '[]'));
          if (!Array.isArray(liveOrders)) liveOrders = [];
        } catch(e) { liveOrders = []; }

        try {
          historyOrders = JSON.parse(safeGet(`kds_history_${s.id}`, '[]'));
          if (!Array.isArray(historyOrders)) historyOrders = [];
        } catch(e) { historyOrders = []; }

        renderLiveGrid();

        if (s.url && s.key && window.supabase) {
          supabaseClient = window.supabase.createClient(s.url, s.key);
          await fetchLiveOrdersFromCloud();
          await fetchHistoryFromCloud();
          listenSupabaseRealtime();
        }
      } catch (err) {
        console.error("activateKdsShop Error:", err);
      }
    }

    function lockKDS() {
      currentShop = null;
      supabaseClient = null;
      safeSet('kds_active_shop_id', '');
      clearPinInput();
      const overlay = document.getElementById('kds-pin-overlay');
      if (overlay) overlay.style.display = 'flex';
      setTimeout(() => {
        const input = document.getElementById('kds-pin-display');
        if (input) input.focus();
      }, 100);
    }

    function triggerAlertSound() {
      const mode = document.getElementById('sound-type-select').value;
      if (mode === 'mute') return;

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (mode === 'chime') {
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine'; osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc1.connect(gain1); gain1.connect(audioCtx.destination);
          osc1.start(); osc1.stop(audioCtx.currentTime + 0.25);

          setTimeout(() => {
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.35);
          }, 150);
        } else if (mode === 'buzzer') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (mode === 'double_beep') {
          const playBeep = (delay) => {
            setTimeout(() => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'square'; osc.frequency.setValueAtTime(900, audioCtx.currentTime);
              gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }, delay);
          };
          playBeep(0); playBeep(140);
        }
      } catch (e) {}
    }

    function saveSoundPreference() {
      const mode = document.getElementById('sound-type-select').value;
      safeSet('kds_sound_mode', mode);
    }

    function onStationFilterChange() {
      currentStation = document.getElementById('station-filter-select').value;
      safeSet('kds_selected_station', currentStation);
      renderLiveGrid();
    }

    async function fetchLiveOrdersFromCloud() {
      if (!supabaseClient || !currentShop) return;
      try {
        const { data } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('shop_id', currentShop.id)
          .eq('status', 'pending')
          .order('id', { ascending: true });

        if (data) {
          liveOrders = data;
          saveLocalKdsState();
          renderLiveGrid();
        }
      } catch (e) {}
    }

    async function fetchHistoryFromCloud() {
      if (!supabaseClient || !currentShop) return;
      try {
        const { data } = await supabaseClient
          .from('orders')
          .select('*')
          .eq('shop_id', currentShop.id)
          .eq('status', 'completed')
          .order('id', { ascending: false })
          .limit(60);

        if (data) {
          historyOrders = data;
          saveLocalKdsState();
          if (currentView === 'history') renderHistoryTable();
        }
      } catch (e) {}
    }

    function listenSupabaseRealtime() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('kds-live-orders-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
          const newOrder = payload.new;
          if (newOrder.shop_id === currentShop.id && newOrder.status === 'pending') {
            if (!liveOrders.find(o => String(o.id) === String(newOrder.id))) {
              liveOrders.push(newOrder);
              saveLocalKdsState();
              triggerAlertSound();
              renderLiveGrid();
            }
          }
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, payload => {
          const updated = payload.new;
          if (updated.shop_id !== currentShop.id) return;

          if (updated.status === 'completed') {
            liveOrders = liveOrders.filter(o => String(o.id) !== String(updated.id));
            if (!historyOrders.find(o => String(o.id) === String(updated.id))) {
              historyOrders.unshift(updated);
            }
          } else if (updated.status === 'pending') {
            historyOrders = historyOrders.filter(o => String(o.id) !== String(updated.id));
            if (!liveOrders.find(o => String(o.id) === String(updated.id))) {
              liveOrders.push(updated);
            }
          }
          saveLocalKdsState();
          renderLiveGrid();
          if (currentView === 'history') renderHistoryTable();
        })
        .subscribe();
    }

    if (localChannel) {
      localChannel.onmessage = function(e) {
        if (e.data && e.data.type === 'NEW_ORDER') {
          const newOrder = e.data.order;
          if (!currentShop || newOrder.shop_id === currentShop.id) {
            if (!liveOrders.find(o => String(o.id) === String(newOrder.id))) {
              liveOrders.push(newOrder);
              saveLocalKdsState();
              triggerAlertSound();
              renderLiveGrid();
            }
          }
        }
      };
    }

    function saveLocalKdsState() {
      if (currentShop) {
        safeSet(`kds_live_${currentShop.id}`, JSON.stringify(liveOrders));
        safeSet(`kds_history_${currentShop.id}`, JSON.stringify(historyOrders));
      }
    }

    async function completeOrderSingleClick(orderId) {
      const order = liveOrders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      order.status = 'completed';
      order.completed_at = new Date().toLocaleTimeString();
      liveOrders = liveOrders.filter(o => String(o.id) !== String(orderId));
      historyOrders.unshift(order);
      saveLocalKdsState();
      renderLiveGrid();

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({ status: 'completed', completed_at: new Date().toISOString() })
            .eq('id', orderId);
        } catch(e) {}
      }
    }

    async function recallOrderBackToLive(orderId) {
      const order = historyOrders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      order.status = 'pending';
      historyOrders = historyOrders.filter(o => String(o.id) !== String(orderId));
      liveOrders.push(order);
      saveLocalKdsState();
      renderHistoryTable();
      renderLiveGrid();

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('orders')
            .update({ status: 'pending', completed_at: null })
            .eq('id', orderId);
        } catch(e) {}
      }
      alert(`${order.token} വീണ്ടും ലൈവ് കിച്ചനിലേക്ക് തിരികെ മാറ്റി!`);
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-live').classList.toggle('active', view === 'live');
      document.getElementById('tab-history').classList.toggle('active', view === 'history');

      if (view === 'live') {
        document.getElementById('kds-orders-container').style.display = 'grid';
        document.getElementById('history-view').style.display = 'none';
        renderLiveGrid();
      } else {
        document.getElementById('kds-orders-container').style.display = 'none';
        document.getElementById('history-view').style.display = 'flex';
        fetchHistoryFromCloud();
        renderHistoryTable();
      }
    }

    function renderLiveGrid() {
      const container = document.getElementById('kds-orders-container');
      if (!container) return;
      const now = Date.now();

      let displayOrders = liveOrders.map(order => {
        let rawItems = order.items || [];
        if (typeof rawItems === 'string') {
          try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
        }
        if (!Array.isArray(rawItems)) rawItems = [];

        let items = rawItems;
        if (currentStation !== 'All') {
          items = items.filter(it => (it.station || 'Main Kitchen') === currentStation);
        }
        return { ...order, filteredItems: items };
      }).filter(order => order.filteredItems && order.filteredItems.length > 0);

      const countEl = document.getElementById('live-count');
      if (countEl) countEl.innerText = displayOrders.length;

      if (displayOrders.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 50px; margin-bottom: 10px;">🧑‍🍳</div>
            <div>${currentStation === 'All' ? 'പെൻഡിങ് ഓർഡറുകൾ ഒന്നുമില്ല (All Completed!)' : `${currentStation} സെക്ഷനിൽ ഓർഡറുകൾ ഒന്നുമില്ല.`}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      displayOrders.forEach(order => {
        const orderTimeMs = Number(order.id) || now;
        const elapsedSec = Math.floor((now - orderTimeMs) / 1000);
        const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
        const secs = String(elapsedSec % 60).padStart(2, '0');
        const isLate = elapsedSec > 600;

        const custPhone = order.customer_phone || order.phone || '';

        let itemsHtml = order.filteredItems.map(it => {
          const isSpicy = (it.name || '').includes('Spicy');
          return `
            <div class="kds-item-row">
              <div class="kds-item-name">
                ${it.name || ''}
                ${isSpicy ? `<span class="spicy-tag">🌶️ SPICY</span>` : ''}
                <span class="item-station-tag">[${it.station || 'Main'}]</span>
              </div>
              <div class="kds-item-qty">X ${it.qty || 1}</div>
            </div>
          `;
        }).join('');

        const card = document.createElement('div');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-token">${order.token || 'Token'}</span>
            <span class="timer-badge ${isLate ? 'timer-late' : ''}" id="timer-${order.id}">⏱️ ${mins}:${secs}</span>
          </div>
          <div class="card-meta">
            <span>${order.order_type || order.type || 'Takeaway'}</span>
            ${custPhone ? `<span class="meta-phone">📞 ${custPhone}</span>` : `<span>${order.time || ''}</span>`}
          </div>
          <div class="card-items">
            ${itemsHtml}
          </div>
          <div class="card-actions">
            <button type="button" class="btn-done-single" onclick="completeOrderSingleClick(${order.id})">
              ✅ കംപ്ലീറ്റ് (Done)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderHistoryTable() {
      const tbody = document.getElementById('history-table-body');
      if (!tbody) return;
      const searchVal = (document.getElementById('history-search-input').value || '').toLowerCase().trim();

      let list = historyOrders;
      if (searchVal) {
        list = list.filter(o => {
          const tokenMatch = (o.token || '').toLowerCase().includes(searchVal);
          const phoneMatch = (o.customer_phone || o.phone || '').includes(searchVal);
          return tokenMatch || phoneMatch;
        });
      }

      document.getElementById('history-count-text').innerText = `${list.length} കഴിഞ്ഞ ഓർഡറുകൾ (Cloud)`;
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding:20px;">ഓർഡറുകൾ ഒന്നും കണ്ടെത്തിയില്ല</td></tr>`;
        return;
      }

      list.forEach(o => {
        let rawItems = o.items || [];
        if (typeof rawItems === 'string') {
          try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
        }
        if (!Array.isArray(rawItems)) rawItems = [];

        const itemsSummary = rawItems.map(it => `${it.name || ''} (x${it.qty || 1})`).join(', ');
        const custPhone = o.customer_phone || o.phone || '-';

        tbody.innerHTML += `
          <tr>
            <td><strong style="color:#facc15; font-size:15px;">${o.token || '-'}</strong></td>
            <td>${o.order_type || o.type || '-'}</td>
            <td style="color:#38bdf8;">${custPhone}</td>
            <td style="max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${itemsSummary}</td>
            <td>${o.time || '-'}</td>
            <td style="color:#10b981;">${o.completed_at ? new Date(o.completed_at).toLocaleTimeString() : 'Done'}</td>
            <td>
              <button type="button" class="btn-recall" onclick="recallOrderBackToLive(${o.id})">↩️ Recall</button>
            </td>
          </tr>
        `;
      });
    }

    function filterHistoryList() {
      renderHistoryTable();
    }

    setInterval(() => {
      if (currentView !== 'live') return;
      const now = Date.now();
      liveOrders.forEach(order => {
        const el = document.getElementById(`timer-${order.id}`);
        if (el) {
          const orderTimeMs = Number(order.id) || now;
          const elapsedSec = Math.floor((now - orderTimeMs) / 1000);
          const mins = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
          const secs = String(elapsedSec % 60).padStart(2, '0');
          el.innerText = `⏱️ ${mins}:${secs}`;
          if (elapsedSec > 600) el.classList.add('timer-late');
        }
      });
    }, 1000);

    // Physical Keyboard Support
    window.addEventListener('keydown', (e) => {
      const overlay = document.getElementById('kds-pin-overlay');
      if (overlay && overlay.style.display !== 'none') {
        const input = document.getElementById('kds-pin-display');
        if (input && document.activeElement !== input) {
          if (e.key >= '0' && e.key <= '9') pressNumpad(e.key);
          else if (e.key === 'Backspace') pressBackspace();
          else if (e.key === 'Enter') submitPinCheck();
        }
      }
    });

    // Startup
    renderQuickBranchButtons();
    const savedShopId = safeGet('kds_active_shop_id');
    const existingShop = getAllShops().find(s => s.id === savedShopId);
    if (existingShop) {
      activateKdsShop(existingShop);
    } else {
      document.getElementById('kds-pin-overlay').style.display = 'flex';
      setTimeout(() => {
        const input = document.getElementById('kds-pin-display');
        if (input) input.focus();
      }, 100);
    }
  </script>
</body>
</html>
